name: Daily task
on:
  schedule:
    - cron: '37 22 * * *'
    # Temporary credential-free scheduler probe; remove after verification.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      fast_validation:
        description: Run without privacy time padding
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['.github/workflows/signin.yml']
permissions: {}
concurrency:
  group: daily-task
  cancel-in-progress: false
jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - name: Fetch public source at exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "$REVISION"
          git checkout --quiet --detach FETCH_HEAD
      - name: Run offline tests
        run: python3 -B -m unittest -q test_signin test_private_run test_validate_run test_verify_status
      - name: Daily task
        if: (github.event_name == 'schedule' && github.event.schedule == '37 22 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.fast_validation)
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BDUSS_SECOND: ${{ secrets.BDUSS_SECOND || secrets.BDUSS }}
        run: python3 -I -B private_run.py
      - name: Fast validation
        if: github.event_name == 'workflow_dispatch' && inputs.fast_validation
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BDUSS_SECOND: ${{ secrets.BDUSS_SECOND }}
        run: python3 -I -B validate_run.py
